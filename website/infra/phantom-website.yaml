AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The Phantom website: a private S3 bucket served worldwide over HTTPS by CloudFront, an optional custom domain
  (Route 53 + a free ACM certificate), a deploy role GitHub Actions can assume without stored keys, and a monthly
  budget alarm. Create the stack in us-east-1 (CloudFront certificates must live there).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Domain (leave empty to start with the CloudFront address)" }
        Parameters: [DomainName, HostedZoneId]
      - Label: { default: "Deploys from GitHub" }
        Parameters: [GitHubRepo, GitHubBranch, CreateGitHubOidcProvider]
      - Label: { default: "Cost alarm" }
        Parameters: [AlertEmail, MonthlyBudgetUsd]

Parameters:
  DomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"
    Description: "The site's domain, without www (e.g. phantom.example). Empty: use the cloudfront.net address."
  HostedZoneId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^Z[A-Z0-9]+$"
    Description: "The Route 53 hosted zone of that domain (Route 53 > Hosted zones). Needed when DomainName is set."
  GitHubRepo:
    Type: String
    Default: priyanshi1104-06/Phantom
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: The GitHub repository allowed to deploy (owner/name).
  GitHubBranch:
    Type: String
    Default: main
    Description: The only branch whose workflow runs may deploy.
  CreateGitHubOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >-
      "yes" unless this AWS account already has the GitHub provider (IAM > Identity providers lists
      token.actions.githubusercontent.com).
  AlertEmail:
    Type: String
    Default: ""
    Description: Email for the budget alarm (80% of the monthly budget spent, or 100% forecast). Empty = no alarm.
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Monthly spending, in US dollars, that triggers the alarm. It covers the whole AWS account.

Rules:
  UsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Create this stack in us-east-1 (N. Virginia); CloudFront only accepts certificates from there.
  DomainNeedsZone:
    RuleCondition: !Not [!Equals [!Ref DomainName, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref HostedZoneId, ""]]
        AssertDescription: A custom domain needs its Route 53 hosted zone id (HostedZoneId).

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "yes"]
  HasAlert: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ---------- where the files live: private, encrypted, versioned (old versions kept 30 days) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: forget-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyThisCloudFrontDistributionReads
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- HTTPS for the custom domain (free, renews itself) ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "www.${DomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  # ---------- www.example -> example, and /about -> /about/index.html ----------
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirects www to the bare domain; serves index.html for folder paths.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host.indexOf('www.') === 0) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://' + host.slice(4) + request.uri } }
            };
          }
          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (request.uri.split('/').pop().indexOf('.') === -1) {
            request.uri += '/index.html';
          }
          return request;
        }

  # ---------- security headers on every response ----------
  HeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:;
              base-uri 'none'; form-action 'none'; frame-ancestors 'none'
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
              Override: true

  # ---------- the CDN: copies of the site near every visitor ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Phantom website
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Aliases: !If [HasDomain, [!Ref DomainName, !Sub "www.${DomainName}"], !Ref "AWS::NoValue"]
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS managed: CachingOptimized
          ResponseHeadersPolicyId: !Ref HeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionARN
        CustomErrorResponses:  # S3 answers 403 for a missing file when it can't list the bucket
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  # ---------- deploys: GitHub Actions gets short-lived credentials, only for this repo and branch ----------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the website workflow of one GitHub repository upload the site and refresh the CDN.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy-website
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- an email before the bill surprises anyone ----------
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasAlert
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  SiteUrl:
    Description: The website's address. Put it in website/site.json as site_url.
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  BucketName:
    Description: GitHub repository variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub repository variable SITE_DISTRIBUTION_ID.
    Value: !Ref Distribution
  DeployRoleArn:
    Description: GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
