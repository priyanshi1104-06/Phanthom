AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The Phantom website: a private S3 bucket served worldwide over HTTPS by CloudFront, an optional custom domain
  (Route 53 + a free ACM certificate), a deploy role GitHub Actions can assume without stored keys, and a monthly
  budget alarm. Create the stack in us-east-1 (CloudFront certificates must live there).

Metadata:
  cfn-lint:
    config:
      ignore_checks: [W1030]  # AuthDomainPrefix may be empty, but then the resources that use it don't exist
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Domain (leave empty to start with the CloudFront address)" }
        Parameters: [DomainName, HostedZoneId]
      - Label: { default: "Deploys from GitHub" }
        Parameters: [GitHubRepo, GitHubBranch, CreateGitHubOidcProvider]
      - Label: { default: "Sign in with Google (leave empty until you have a Google OAuth client)" }
        Parameters: [AuthDomainPrefix, GoogleClientId, GoogleClientSecret, SenderEmail]
      - Label: { default: "Cost alarm" }
        Parameters: [AlertEmail, MonthlyBudgetUsd]

Parameters:
  DomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"
    Description: "The site's domain, without www (e.g. phantom.example). Empty: use the cloudfront.net address."
  HostedZoneId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^Z[A-Z0-9]+$"
    Description: "The Route 53 hosted zone of that domain (Route 53 > Hosted zones). Needed when DomainName is set."
  GitHubRepo:
    Type: String
    Default: priyanshi1104-06/Phantom
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: The GitHub repository allowed to deploy (owner/name).
  GitHubBranch:
    Type: String
    Default: main
    Description: The only branch whose workflow runs may deploy.
  CreateGitHubOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >-
      "yes" unless this AWS account already has the GitHub provider (IAM > Identity providers lists
      token.actions.githubusercontent.com).
  AuthDomainPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: >-
      The first part of the sign-in address, PREFIX.auth.us-east-1.amazoncognito.com (lowercase letters, digits,
      hyphens; must be unused worldwide and can't contain aws, amazon or cognito), e.g. phantom-ai-signin.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Client ID of the Google OAuth client (Google Cloud > APIs & Services > Credentials).
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Client secret of that Google OAuth client.
  SenderEmail:
    Type: String
    Default: ""
    Description: >-
      The From address of the early access confirmation email, verified in Amazon SES (SES > Identities). Empty: no
      email (the account page still confirms).
  AlertEmail:
    Type: String
    Default: ""
    Description: Email for the budget alarm (80% of the monthly budget spent, or 100% forecast). Empty = no alarm.
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Monthly spending, in US dollars, that triggers the alarm. It covers the whole AWS account.

Rules:
  UsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Create this stack in us-east-1 (N. Virginia); CloudFront only accepts certificates from there.
  GoogleNeedsAll:
    RuleCondition: !Not [!Equals [!Ref GoogleClientId, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref GoogleClientSecret, ""]]
        AssertDescription: Google sign-in needs the client secret too (GoogleClientSecret).
      - Assert: !Not [!Equals [!Ref AuthDomainPrefix, ""]]
        AssertDescription: Google sign-in needs a sign-in address (AuthDomainPrefix).
  DomainNeedsZone:
    RuleCondition: !Not [!Equals [!Ref DomainName, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref HostedZoneId, ""]]
        AssertDescription: A custom domain needs its Route 53 hosted zone id (HostedZoneId).

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "yes"]
  HasAlert: !Not [!Equals [!Ref AlertEmail, ""]]
  HasAuth: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasEmail: !And [!Condition HasAuth, !Not [!Equals [!Ref SenderEmail, ""]]]

Resources:
  # ---------- where the files live: private, encrypted, versioned (old versions kept 30 days) ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: forget-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyThisCloudFrontDistributionReads
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------- HTTPS for the custom domain (free, renews itself) ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "www.${DomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  # ---------- www.example -> example, and /about -> /about/index.html ----------
  RewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirects www to the bare domain; serves index.html for folder paths.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host.indexOf('www.') === 0) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://' + host.slice(4) + request.uri } }
            };
          }
          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (request.uri.split('/').pop().indexOf('.') === -1) {
            request.uri += '/index.html';
          }
          return request;
        }

  # ---------- security headers on every response ----------
  HeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:  # the site's own files only; plus, with sign-in, the Cognito token endpoint
            ContentSecurityPolicy: !If
              - HasAuth
              - !Sub >-
                default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self';
                connect-src https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com;
                base-uri 'none'; form-action 'none'; frame-ancestors 'none'
              - >-
                default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self';
                base-uri 'none'; form-action 'none'; frame-ancestors 'none'
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
              Override: true

  # ---------- the CDN: copies of the site near every visitor ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Phantom website
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Aliases: !If [HasDomain, [!Ref DomainName, !Sub "www.${DomainName}"], !Ref "AWS::NoValue"]
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS managed: CachingOptimized
          ResponseHeadersPolicyId: !Ref HeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteFunction.FunctionARN
        CustomErrorResponses:  # S3 answers 403 for a missing file when it can't list the bucket
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
        - Name: !Sub "www.${DomainName}"
          Type: AAAA
          AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  # ---------- accounts: "Continue with Google" through Amazon Cognito; signing in is joining early access ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: HasAuth
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-accounts"
      LambdaConfig: !If [HasEmail, { PreSignUp: !GetAtt WelcomeEmail.Arn }, !Ref "AWS::NoValue"]
      UsernameAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }  # no passwords to leak: Google is the only way in
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: admin_only, Priority: 1 }]
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasAuth
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasAuth
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  WebsiteClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasAuth
    DependsOn: GoogleProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: website
      GenerateSecret: false  # a public client: the browser proves itself with PKCE instead
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [Google]
      CallbackURLs:
        - !If [HasDomain, !Sub "https://${DomainName}/account.html", !Sub "https://${Distribution.DomainName}/account.html"]
        - http://localhost:8000/account.html
      LogoutURLs:
        - !If [HasDomain, !Sub "https://${DomainName}/", !Sub "https://${Distribution.DomainName}/"]
        - http://localhost:8000/
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }

  # ---------- the confirmation email, sent once, when someone signs in for the first time ----------
  WelcomeEmailRole:
    Type: AWS::IAM::Role
    Condition: HasEmail
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: send-welcome-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"
                Condition:
                  StringEquals: { "ses:FromAddress": !Ref SenderEmail }

  WelcomeEmail:
    Type: AWS::Lambda::Function
    Condition: HasEmail
    Properties:
      Description: Emails the early access confirmation when someone signs in with Google for the first time.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt WelcomeEmailRole.Arn
      Environment:
        Variables:
          SENDER: !Ref SenderEmail
          SITE_URL: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
      Code:
        ZipFile: |
          import os
          import boto3

          SES = boto3.client("ses")
          SUBJECT = "You're in: Phantom early access"
          TEXT = """Hi{name},

          You're on the Phantom early access list, and your access is open now.

          Install Phantom in VS Code: {site}/account.html
          (sign in with Google again if asked). Phantom needs Docker and Python 3 on your machine.

          Questions or feedback? Reply to this email.

          Phantom
          {site}
          """

          def handler(event, context):
              """Cognito pre sign-up trigger: a Google account is about to become a Phantom account.
              The email is a courtesy: if it can't be sent, the sign-up still goes ahead."""
              if event.get("triggerSource") == "PreSignUp_ExternalProvider":
                  attributes = event["request"]["userAttributes"]
                  email = attributes.get("email")
                  first = (attributes.get("name") or "").split(" ")[0]
                  if email:
                      body = TEXT.format(name=f" {first}" if first else "", site=os.environ["SITE_URL"])
                      body = "\n".join(line.strip() for line in body.splitlines())
                      try:
                          SES.send_email(
                              Source=f"Phantom <{os.environ['SENDER']}>",
                              Destination={"ToAddresses": [email]},
                              Message={"Subject": {"Data": SUBJECT}, "Body": {"Text": {"Data": body}}},
                          )
                      except Exception as exc:  # noqa: BLE001 - never block a sign-up on email
                          print(f"confirmation email not sent: {exc}")
              return event

  WelcomeEmailPermission:
    Type: AWS::Lambda::Permission
    Condition: HasEmail
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WelcomeEmail
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ---------- deploys: GitHub Actions gets short-lived credentials, only for this repo and branch ----------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the website workflow of one GitHub repository upload the site and refresh the CDN.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy-website
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------- an email before the bill surprises anyone ----------
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasAlert
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  SiteUrl:
    Description: The website's address. Put it in website/site.json as site_url.
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  BucketName:
    Description: GitHub repository variable SITE_BUCKET.
    Value: !Ref SiteBucket
  DistributionId:
    Description: GitHub repository variable SITE_DISTRIBUTION_ID.
    Value: !Ref Distribution
  DeployRoleArn:
    Description: GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  AuthDomain:
    Condition: HasAuth
    Description: Put it in website/site.json as auth_domain.
    Value: !Sub "${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  AuthClientId:
    Condition: HasAuth
    Description: Put it in website/site.json as auth_client_id.
    Value: !Ref WebsiteClient
  GoogleRedirectUri:
    Condition: HasAuth
    Description: Must be listed under "Authorized redirect URIs" in the Google OAuth client.
    Value: !Sub "https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
