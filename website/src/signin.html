<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Phantom</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  {{auth_meta}}
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="./" aria-label="Phantom home">
        <img src="assets/mark.svg" alt="" width="26" height="26">
        <span class="word">PHANTOM<span>.AI</span></span>
      </a>
    </div>
  </header>

  <main class="wrap signin">
    <div class="signin-card">
      <img class="signin-mark" src="assets/mark.svg" alt="" width="44" height="44">
      <h1>Sign in to Phantom</h1>
      <p>Sign in with Google to get Phantom early access for VS Code. It's free while in early access.</p>
      {{google_button}}
      <p class="signin-note">{{signin_note}}</p>
    </div>
  </main>
  <script src="assets/auth.js" defer></script>
</body>
</html>
